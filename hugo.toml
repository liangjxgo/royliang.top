baseURL = "https://liangjx.top/"
languageCode = "zh-cn"
title = "Roy Liang"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
enableGitInfo = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  description = "Code · Thinking · Life"
  author = "Roy Liang"
  defaultTheme = "auto"
  showReadingTime = true
  showShareButtons = false
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  showToc = true
  TocOpen = false
  hideFooter = false
  dateFormat = "2006-01-02"

  [params.homeInfoParams]
    Title = "Hi, I'm Roy Liang"
    Content = "Java Engineer · AI Agent Explorer · Life Observer"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/liangjxgo"

[params.editPost]
  URL = "https://github.com/liangjxgo/ChineseItBoss.github.io/tree/source/content"
  Text = "Suggest Changes"
  appendFilePath = true

[menu]
  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "/archives/"
    weight = 5
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 10
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 15
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    codeFences = true
    guessSyntax = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
