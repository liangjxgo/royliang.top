baseURL = "https://liangjx.top/"
languageCode = "zh-cn"
title = "Roy Liang"
theme = "hello-friend"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
enableGitInfo = true
enableEmoji = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[minify]
  disableXML = true
  minifyOutput = true

[pagination]
  disableAliases = false
  pagerSize = 10
  path = 'page'

[params]
  dateform        = "2006-01-02"
  dateformShort   = "01-02"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  description = "代码 · 思考 · 生活"
  keywords = ""
  images = [""]

  homeSubtitle = "Hi, I'm Roy Liang"

  enableThemeToggle = true
  enableSharingButtons = false
  enableReadingTime = true
  enableGlobalLanguageMenu = false

  [params.author]
    name = "Roy Liang"

  [params.footer]
    trademark = 2026
    rss = true
    copyright = true
    author = true

    topText = []
    bottomText = [
      "Powered by <a href=\"http://gohugo.io\">Hugo</a>",
      "Theme by <a href=\"https://github.com/rhazdon\">hello-friend</a>"
    ]

  [params.logo]
    logoMark     = ">"
    logoText     = "$ cd /home/roy"
    logoHomeLink = "/"
    logoCursorColor    = "#67a2c9"
    logoCursorAnimate  = "2s"

  [[params.social]]
    name = "github"
    url  = "https://github.com/liangjxgo"

[languages]
  [languages.zh-cn]
    weight    = 1
    languageName = "中文"
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
    hasCJKLanguage = true
  [languages.zh-cn.params]
    subtitle  = "Java 工程师 · AI 探索者 · 生活观察者"

[menu]
  [[menu.main]]
    identifier = "archives"
    name       = "归档"
    url        = "/archives/"
  [[menu.main]]
    identifier = "tags"
    name       = "标签"
    url        = "/tags/"
  [[menu.main]]
    identifier = "categories"
    name       = "分类"
    url        = "/categories/"
  [[menu.main]]
    identifier = "about"
    name       = "关于"
    url        = "/about/"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    codeFences = true
    guessSyntax = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
